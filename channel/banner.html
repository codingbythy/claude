<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,500&display=swap">
<style>
html,body{margin:0;width:2560px;height:1440px;overflow:hidden;background:#0c1527}
.l,.r{position:absolute;background-repeat:no-repeat;image-rendering:auto}
/* cabin fireplace, scale 1.75, flames (source 150,600) near the centre line */
.l{left:0;top:0;width:900px;height:1440px;background-image:url(cabin.webp);background-size:2926px 1647px;background-position:0px -207px;
  -webkit-mask-image:linear-gradient(to right,#000 50%,rgba(0,0,0,.6) 72%,transparent 100%);mask-image:linear-gradient(to right,#000 50%,rgba(0,0,0,.6) 72%,transparent 100%)}
/* cottage window with the lighthouse, scale 1.75, source x 1181+ */
.r{right:0;top:0;width:900px;height:1440px;background-image:url(room.webp);background-size:2926px 1647px;background-position:-2026px -67px;
  -webkit-mask-image:linear-gradient(to left,#000 50%,rgba(0,0,0,.6) 72%,transparent 100%);mask-image:linear-gradient(to left,#000 50%,rgba(0,0,0,.6) 72%,transparent 100%)}
.vig{position:absolute;inset:0;background:
  radial-gradient(ellipse 1100px 330px at 50% 50%,rgba(12,21,39,.9),rgba(12,21,39,.55) 60%,rgba(12,21,39,0) 100%),
  linear-gradient(to bottom,rgba(8,12,22,.75) 0%,rgba(8,12,22,0) 30%,rgba(8,12,22,0) 70%,rgba(8,12,22,.8) 100%)}
canvas{position:absolute;left:0;top:0;width:2560px;height:1440px;image-rendering:pixelated}
.cat{position:absolute;image-rendering:pixelated}
.t{position:absolute;left:0;right:0;top:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center}
h1{margin:0;font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;font-size:150px;line-height:1;color:#f4e6cc;letter-spacing:.01em;text-shadow:0 4px 18px rgba(0,0,0,.6)}
p{margin:0;font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-weight:500;font-size:68px;color:#e7d6b6;letter-spacing:.04em;text-shadow:0 3px 12px rgba(0,0,0,.6)}
.guide{position:absolute;left:507px;top:508px;width:1546px;height:423px;outline:4px dashed #f0f}
</style></head><body>
<div class="l"></div><div class="r"></div>
<canvas id="rain" width="640" height="360"></canvas>
<div class="vig"></div>
<img class="cat" src="cat-sprite.png">
<div class="t"><h1>Somewhere Sheltered</h1><p>Bad weather. Safe inside.</p></div>
<div class="guide" id="guide" hidden></div>
<script>
if (location.hash === '#guide') document.getElementById('guide').hidden = false;
// sparse pixel rain over the navy middle, on a quarter-resolution grid like the videos
const c = document.getElementById('rain').getContext('2d');
let a = 7; const rnd = () => (a = (a * 16807) % 2147483647) / 2147483647;
for (let i = 0; i < 260; i++) {
  const x = 150 + rnd() * 340, y = rnd() * 360, al = 0.05 + rnd() * 0.12, len = 3 + Math.floor(rnd() * 4);
  c.fillStyle = `rgba(190,210,240,${al.toFixed(2)})`;
  for (let k = 0; k < len; k++) c.fillRect(Math.round(x + k * 0.3), Math.round(y - k), 1, 1);
}
// the cat sits on the cottage window seat (source x ~1225, feet y 592) at 7 px per sprite pixel
const img = document.querySelector('.cat');
const sx = 1.75, left = 2560 - 900 - 2026 + 1225 * sx, feet = -67 + 592 * sx;
img.style.width = (22 * 7) + 'px'; img.style.height = (21 * 7) + 'px';
img.style.left = (left - 11 * 7) + 'px'; img.style.top = (feet - 21 * 7) + 'px';
</script></body></html>
