<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<!--PAGE-->
<title>Botanist's Glasshouse</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&family=Nunito:wght@400;600&display=swap">
<style>
/* Layout: the painting fills the screen; one control chip in the bottom-left corner fades away when idle. Same shell as the other Somewhere Sheltered rooms. */
:root {
  color-scheme: dark;
  --night: #0b0f12;
  --cream: #efe6d2;
  --cream-dim: #c4baa2;
  --lamp: #e8b65a;
  --panel: rgba(20, 18, 14, 0.86);
  --line: rgba(239, 230, 210, 0.18);
  --display: "Pixelify Sans", "Courier New", monospace;
  --body: "Nunito", "Segoe UI", system-ui, sans-serif;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--night); color: var(--cream); font-family: var(--body); font-size: 15px; overflow: hidden; }
#stage { position: fixed; inset: 0; overflow: hidden; background: var(--night); }
#scene { position: absolute; left: 0; top: 0; width: 1672px; height: 941px; transform-origin: 0 0; }
#scene > * { position: absolute; left: 0; top: 0; width: 1672px; height: 941px; pointer-events: none; }
#scene img { display: block; max-width: none; }
#scene canvas.px { image-rendering: pixelated; }
#lampGlow { background: radial-gradient(circle at 1140px 380px, rgba(255, 196, 110, 0.55), rgba(255, 170, 80, 0) 240px); mix-blend-mode: screen; opacity: 0.25; }
#dim { position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity 45s linear; }
.hud { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: flex-end; align-items: flex-start; gap: 10px;
  padding-block: 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); pointer-events: none; transition: opacity 0.8s; }
.hud.idle { opacity: 0; }
.hud > * { pointer-events: auto; }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--lamp); outline-offset: 2px; }
.chip { font-family: var(--display); font-size: 16px; letter-spacing: 0.03em; background: var(--panel); border: 2px solid var(--line); color: var(--cream);
  padding: 8px 14px; display: flex; align-items: center; gap: 10px; }
.chip:hover { border-color: var(--lamp); }
.chip .dot { width: 8px; height: 8px; background: var(--cream-dim); }
.chip.on .dot { background: var(--lamp); box-shadow: 0 0 8px var(--lamp); }
.chip small { font-family: var(--body); font-size: 13px; color: var(--cream-dim); }
.panel { width: min(320px, 100%); background: var(--panel); border: 2px solid var(--line); padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.panel h1 { font-family: var(--display); font-weight: 600; font-size: 22px; margin: 0; color: var(--lamp); text-wrap: balance; }
.panel p { margin: 0; color: var(--cream-dim); font-size: 13px; line-height: 1.45; }
.rows { display: grid; grid-template-columns: auto 1fr; gap: 10px 14px; align-items: center; }
.rows label { font-family: var(--display); font-size: 15px; letter-spacing: 0.04em; }
.rows input[type=range] { width: 100%; min-width: 0; accent-color: var(--lamp); }
.rows select { width: 100%; min-width: 0; background: rgba(0, 0, 0, 0.35); border: 2px solid var(--line); padding: 5px 8px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { font-family: var(--display); font-size: 15px; background: transparent; border: 2px solid var(--line); padding: 6px 12px; }
.btn:hover { border-color: var(--lamp); }
.btn.primary { background: var(--lamp); border-color: var(--lamp); color: #2a1a08; font-weight: 600; }
#invite { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: radial-gradient(ellipse at center, rgba(11, 15, 18, 0.55), rgba(11, 15, 18, 0.15) 70%); transition: opacity 1.2s; }
#invite.gone { opacity: 0; pointer-events: none; }
#invite .card { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 14px; max-width: 30ch; }
#invite h2 { font-family: var(--display); font-weight: 600; font-size: clamp(28px, 6vw, 44px); margin: 0; text-shadow: 0 3px 0 rgba(0, 0, 0, 0.6); text-wrap: balance; }
#invite p { margin: 0; color: var(--cream); text-shadow: 0 1px 6px #000; line-height: 1.5; }
#invite .btn { font-size: 18px; padding: 10px 22px; }
</style>
</head>
<body>
<div id="stage">
  <div id="scene">
    <img id="base" src="room.webp" alt="A pixel-art Victorian glasshouse on a rainy autumn evening: tall arched windows onto a garden of red and gold trees, a cream radiator, a brass reading lamp, a cup of tea on a small table and a red velvet armchair with a knitted throw.">
    <canvas id="out" class="px" width="418" height="235"></canvas>
    <canvas id="glass" class="px" width="418" height="235"></canvas>
    <div id="lampGlow"></div>
    <canvas id="room" class="px" width="418" height="235"></canvas>
  </div>
  <div id="dim"></div>

  <div id="invite">
    <div class="card">
      <h2>Botanist's Glasshouse</h2>
      <p>Autumn rain on the glass, leaves in the garden, tea going cold beside you.</p>
      <button class="btn primary" id="begin" type="button">Settle in with sound</button>
    </div>
  </div>

  <div class="hud" id="hud">
    <div class="panel" id="panel" hidden>
      <h1>Botanist's Glasshouse</h1>
      <div class="rows">
        <label for="volRain">Rain</label><input id="volRain" type="range" min="0" max="100" value="55">
        <label for="timer">Sleep timer</label>
        <select id="timer">
          <option value="0" selected>Off</option>
          <option value="15">15 minutes</option>
          <option value="30">30 minutes</option>
          <option value="60">1 hour</option>
          <option value="120">2 hours</option>
        </select>
      </div>
      <div class="actions">
        <button class="btn primary" id="soundToggle" type="button">Turn sound on</button>
        <button class="btn" id="fs" type="button">Full screen</button>
      </div>
      <p>When the sleep timer ends, the sound and the picture fade out together.</p>
    </div>
    <button class="chip" id="chip" type="button" aria-expanded="false" aria-controls="panel">
      <span class="dot"></span><span id="chipLabel">Sound off</span><small id="chipNote">settings</small>
    </button>
  </div>
</div>

<script>
(() => {
  'use strict';
  const SW = 1672, SH = 941, W = 418, H = 235;
  const $ = id => document.getElementById(id);
  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const R = window.__render || null; /* set only by the offline video renderer */
  const clock = () => R ? R.t : performance.now() / 1000;

  const store = {
    get(k, d) { try { const v = localStorage.getItem('glasshouse.' + k); return v === null ? d : v; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem('glasshouse.' + k, v); } catch (e) {} }
  };
  const ui = { rain: $('volRain'), timer: $('timer') };
  ui.rain.value = store.get('rain', 55);

  const scene = $('scene');
  function fit() {
    const vw = innerWidth, vh = innerHeight, s = Math.max(vw / SW, vh / SH);
    const ox = clamp(vw / 2 - 0.5 * SW * s, vw - SW * s, 0), oy = clamp(vh / 2 - 0.5 * SH * s, vh - SH * s, 0);
    scene.style.transform = `translate(${ox}px,${oy}px) scale(${s})`;
  }
  addEventListener('resize', fit); fit();
  const breeze = t => clamp(0.5 + 0.3 * Math.sin(t * 0.21) + 0.15 * Math.sin(t * 0.067 + 1.1), 0, 1);

  /* ---------- glass mask ---------- */
  const base = $('base');
  const mask = document.createElement('canvas'); mask.width = W; mask.height = H;
  let maskReady = false;
  const mImg = new Image();
  mImg.onload = () => { mask.getContext('2d').drawImage(mImg, 0, 0, W, H); maskReady = true; };
  mImg.src = 'glass-mask.png';
  const ready = () => maskReady && base.complete && base.naturalWidth > 0;

  /* ---------- outside: falling leaves and ripples on the path ---------- */
  const outC = $('out'), ox = outC.getContext('2d');
  const LEAF = ['rgba(214,96,40,', 'rgba(186,58,34,', 'rgba(232,160,60,', 'rgba(150,70,40,'];
  const leaves = [];
  function newLeaf(y) {
    const left = Math.random() < 0.7;
    return { x: left ? rand(0, 110) : rand(178, 214), y: y === undefined ? rand(0, 30) : y, vy: rand(5, 9), sway: rand(2, 4), ph: rand(0, 6.28),
      c: LEAF[Math.floor(Math.random() * LEAF.length)], a: rand(0.8, 1), s: Math.random() < 0.4 ? 2 : 1, floor: rand(108, 140), rest: 0 };
  }
  for (let i = 0; i < 20; i++) leaves.push(newLeaf(rand(0, 130)));
  const ripples = [];

  /* ---------- glass: rain falling outside, drops sliding down the panes ---------- */
  const glassC = $('glass'), gx = glassC.getContext('2d');
  const streaks = [];
  for (let i = 0; i < 420; i++) streaks.push({ x: rand(0, W), y: rand(0, 160), v: rand(90, 140), len: rand(3, 6), a: rand(0.07, 0.2) });
  const drops = [];
  function newDrop(y) { return { x: rand(0, W), y: y === undefined ? rand(0, 155) : y, v: 0, stick: rand(1, 10), a: rand(0.3, 0.65), s: Math.random() < 0.18 ? 2 : 1, trail: [] }; }
  for (let i = 0; i < 150; i++) drops.push(newDrop());

  /* ---------- room: tea steam, lamp ---------- */
  const roomC = $('room'), rx = roomC.getContext('2d');
  const steam = [];
  const lampGlow = $('lampGlow');

  function strike() {}   /* no lightning in the glasshouse; kept for the shared renderer */

  let last = clock();
  function frame() {
    const t = clock(), dt = Math.min(0.05, t - last); last = t;
    if (ready()) {
      const br = breeze(t);
      /* outside */
      ox.globalCompositeOperation = 'source-over';
      ox.clearRect(0, 0, W, H);
      for (let i = 0; i < leaves.length; i++) {
        const l = leaves[i];
        if (l.rest > 0) { l.rest -= dt; l.a -= dt * 0.15; if (l.rest <= 0 || l.a <= 0) leaves[i] = newLeaf(); }
        else {
          l.y += l.vy * dt; l.x += (Math.sin(t * 1.3 + l.ph) * l.sway + 2 * br) * dt;
          if (l.y >= l.floor) { l.y = l.floor; l.rest = rand(3, 8); }
        }
        const flip = Math.sin(t * 4 + l.ph) > 0;
        ox.fillStyle = l.c + l.a.toFixed(2) + ')';
        ox.fillRect(Math.round(l.x), Math.round(l.y), flip ? l.s + 1 : l.s, l.s);
      }
      if (Math.random() < dt * 9) ripples.push({ x: rand(86, 165), y: rand(110, 140), age: 0, life: rand(0.5, 0.8) });
      for (let i = ripples.length - 1; i >= 0; i--) {
        const p = ripples[i]; p.age += dt;
        if (p.age > p.life) { ripples.splice(i, 1); continue; }
        const k = p.age / p.life, rr = 0.5 + 3.5 * k;
        ox.fillStyle = `rgba(210,222,240,${(0.7 * (1 - k)).toFixed(2)})`;
        for (let a = 0; a < 6.28; a += 0.7) ox.fillRect(Math.round(p.x + Math.cos(a) * rr), Math.round(p.y + Math.sin(a) * rr * 0.35), 1, 1);
      }
      ox.globalCompositeOperation = 'destination-in';
      ox.drawImage(mask, 0, 0);

      /* glass */
      gx.globalCompositeOperation = 'source-over';
      gx.clearRect(0, 0, W, H);
      const slant = 0.06 + 0.08 * br;
      for (const s of streaks) {
        s.y += s.v * dt; s.x -= s.v * slant * dt;
        if (s.y > 160) { s.y = -rand(0, 10); s.x = rand(0, W + 20); }
        if (s.x < -3) s.x = W + 2;
        gx.fillStyle = `rgba(205,218,236,${s.a})`;
        for (let i = 0; i < s.len; i++) gx.fillRect(Math.round(s.x + slant * i), Math.round(s.y - i), 1, 1);
      }
      for (let i = 0; i < drops.length; i++) {
        const d = drops[i];
        if ((d.stick -= dt) <= 0) {
          d.v = d.v || rand(5, 18);
          d.y += d.v * dt;
          if (Math.random() < dt * 0.7) { d.v = 0; d.stick = rand(0.5, 4); }
          d.trail.push([d.x, d.y]); if (d.trail.length > 12) d.trail.shift();
        }
        if (d.y > 158) { drops[i] = newDrop(rand(0, 60)); continue; }
        gx.fillStyle = `rgba(205,218,236,${(d.a * 0.22).toFixed(2)})`;
        for (const p of d.trail) gx.fillRect(Math.round(p[0]), Math.round(p[1]), 1, 1);
        gx.fillStyle = `rgba(230,238,250,${(d.a * 0.8).toFixed(2)})`;
        gx.fillRect(Math.round(d.x), Math.round(d.y), d.s, d.s + 1);
      }
      gx.globalCompositeOperation = 'destination-in';
      gx.drawImage(mask, 0, 0);

      /* room */
      lampGlow.style.opacity = (0.24 + 0.03 * Math.sin(t * 0.7)).toFixed(3);
      rx.clearRect(0, 0, W, H);
      if (Math.random() < dt * 5) steam.push({ x: rand(267, 270), y: 133, life: rand(2, 3.2), age: 0, ph: rand(0, 6.28) });
      for (let i = steam.length - 1; i >= 0; i--) {
        const p = steam[i]; p.age += dt;
        if (p.age > p.life) { steam.splice(i, 1); continue; }
        p.y -= 6 * dt;
        const k = p.age / p.life;
        rx.fillStyle = `rgba(240,232,220,${(0.32 * Math.sin(Math.PI * k)).toFixed(2)})`;
        rx.fillRect(Math.round(p.x + Math.sin(p.age * 2 + p.ph) * (1 + 2.5 * k)), Math.round(p.y), 1, 1);
      }
    }
    if (!R) requestAnimationFrame(frame);
  }
  if (!R) requestAnimationFrame(frame);

  /* ---------- sound: a faint, steady, muffled rain, nothing sudden to pull you off the page ---------- */
  let ac = null, A = null, running = false;
  const vol = el => Math.pow(el.value / 100, 1.6);
  const atime = () => R ? R.t : ac.currentTime;
  function noise(seconds, brown) {
    const n = Math.floor(ac.sampleRate * seconds), buf = ac.createBuffer(1, n, ac.sampleRate), d = buf.getChannelData(0);
    let v = 0;
    for (let i = 0; i < n; i++) { const w = Math.random() * 2 - 1; if (brown) { v = (v + 0.02 * w) / 1.02; d[i] = v * 3.5; } else d[i] = w; }
    if (brown) { const drift = d[n - 1] - d[0]; for (let i = 0; i < n; i++) d[i] -= drift * i / n; }
    return buf;
  }
  function loop(buf, rate) { const s = ac.createBufferSource(); s.buffer = buf; s.loop = true; s.playbackRate.value = rate || 1; s.start(0, Math.random() * buf.duration); return s; }
  function filt(type, f, q) { const b = ac.createBiquadFilter(); b.type = type; b.frequency.value = f; b.Q.value = q || 0.7; return b; }
  function gain(v) { const g = ac.createGain(); g.gain.value = v; return g; }
  function chain() { for (let i = 1; i < arguments.length; i++) arguments[i - 1].connect(arguments[i]); return arguments[arguments.length - 1]; }

  function buildAudio() {
    ac = R ? R.ac : new (window.AudioContext || window.webkitAudioContext)();
    const brown = noise(11, true), white = noise(3, false);
    const master = gain(0), comp = ac.createDynamicsCompressor();
    comp.threshold.value = -18; comp.ratio.value = 2.5; comp.attack.value = 0.02; comp.release.value = 0.6;
    chain(master, comp, ac.destination);
    const rainBus = gain(vol(ui.rain)), dripBus = gain(0);
    [rainBus, dripBus].forEach(b => b.connect(master));
    /* a soft, dark wash of slow rain: no bright patter, nothing sharp */
    /* rain heard through the glass: a muffled, low wash with the hiss filtered away */
    chain(loop(white), filt('highpass', 180), filt('lowpass', 900), filt('lowpass', 900), gain(0.03), rainBus);
    const patterG = gain(0);
    chain(loop(brown, 1.8), filt('bandpass', 520, 0.5), gain(0.045), rainBus);
    A = { white, master, rainBus, dripBus, patterG, nextTap: atime() + 0.2, nextDrip: atime() + 3 };
  }
  function tap(at) {
    const src = ac.createBufferSource(); src.buffer = A.white;
    const f = filt('bandpass', rand(1400, 3200), rand(4, 8)), g = gain(0);   /* soft, rounded drops on the glass, not clicks */
    const peak = Math.pow(Math.random(), 2.6) * 0.022 + 0.002, len = rand(0.008, 0.02);
    g.gain.setValueAtTime(0, at); g.gain.linearRampToValueAtTime(peak, at + 0.001); g.gain.exponentialRampToValueAtTime(0.0004, at + len);
    chain(src, f, g, A.rainBus); src.start(at, Math.random() * 2.5, len + 0.02);
  }
  function drip(at) {   /* a single water drop landing in a full gutter or a puddle */
    const o = ac.createOscillator(), g = gain(0);
    const f0 = rand(700, 1400);
    o.type = 'sine'; o.frequency.setValueAtTime(f0, at); o.frequency.exponentialRampToValueAtTime(f0 * rand(1.4, 1.9), at + 0.06);
    const peak = rand(0.012, 0.03);
    g.gain.setValueAtTime(0, at); g.gain.linearRampToValueAtTime(peak, at + 0.003); g.gain.exponentialRampToValueAtTime(0.0003, at + rand(0.08, 0.16));
    chain(o, filt('lowpass', 3500), g, A.dripBus); o.start(at); o.stop(at + 0.2);
  }
  function tick() {
    if (!running) return;
    const now = atime(), br = breeze(clock() + 0.6);
    sleepTick();
  }
  if (!R) setInterval(tick, 450);

  /* ---------- controls ---------- */
  const chip = $('chip'), chipLabel = $('chipLabel'), chipNote = $('chipNote'), panel = $('panel'), hud = $('hud'), invite = $('invite'), dim = $('dim'), soundBtn = $('soundToggle');
  let sleepAt = 0, fading = false;
  function setSound(on) {
    if (on) {
      if (!ac) buildAudio();
      if (!R) ac.resume();
      running = true; fading = false;
      dim.style.transition = 'opacity 1.5s'; dim.style.opacity = 0;
      A.master.gain.cancelScheduledValues(atime()); A.master.gain.setTargetAtTime(0.9, atime(), 1.2);
      armSleep();
    } else if (ac) {
      running = false;
      A.master.gain.cancelScheduledValues(atime()); A.master.gain.setTargetAtTime(0, atime(), 0.25);
      setTimeout(() => { if (!running) ac.suspend(); }, 1500);
    }
    chip.classList.toggle('on', on);
    soundBtn.textContent = running ? 'Turn sound off' : 'Turn sound on';
    label();
  }
  function label() {
    chipLabel.textContent = running ? 'Sound on' : 'Sound off';
    chipNote.textContent = running && sleepAt && !fading ? `sleep in ${Math.max(1, Math.ceil((sleepAt - clock()) / 60))} min` : 'settings';
  }
  function armSleep() { const m = +ui.timer.value; sleepAt = m ? clock() + m * 60 : 0; label(); }
  function sleepTick() {
    if (!sleepAt) return;
    label();
    if (!fading && clock() >= sleepAt - 45) {
      fading = true;
      A.master.gain.cancelScheduledValues(atime()); A.master.gain.setTargetAtTime(0, atime(), 12);
      dim.style.transition = 'opacity 45s linear'; dim.style.opacity = 0.92;
    }
    if (clock() >= sleepAt) { sleepAt = 0; ui.timer.value = '0'; setSound(false); }
  }
  $('begin').addEventListener('click', () => { invite.classList.add('gone'); setSound(true); wake(); });
  invite.addEventListener('click', e => { if (e.target === invite) invite.classList.add('gone'); });
  chip.addEventListener('click', () => {
    const open = panel.hidden;
    panel.hidden = !open; chip.setAttribute('aria-expanded', String(open));
    if (open) invite.classList.add('gone');
  });
  soundBtn.addEventListener('click', () => { invite.classList.add('gone'); setSound(!running); });
  const bus = { rain: 'rainBus' };
  Object.keys(bus).forEach(k => ui[k].addEventListener('input', () => { store.set(k, ui[k].value); if (A) A[bus[k]].gain.setTargetAtTime(vol(ui[k]), atime(), 0.05); }));
  ui.timer.addEventListener('change', () => { if (running) armSleep(); });
  $('fs').addEventListener('click', () => {
    const el = document.documentElement;
    const p = document.fullscreenElement ? document.exitFullscreen() : (el.requestFullscreen ? el.requestFullscreen() : null);
    if (p && p.catch) p.catch(() => {});
  });
  let idleTimer = 0;
  function wake() {
    hud.classList.remove('idle'); clearTimeout(idleTimer);
    idleTimer = setTimeout(() => { if (panel.hidden) hud.classList.add('idle'); }, 5000);
  }
  ['pointermove', 'pointerdown', 'keydown', 'focusin'].forEach(ev => addEventListener(ev, wake));
  wake();
  if (R) { invite.hidden = true; hud.hidden = true; Object.assign(R, { frame, tick, strike, start: () => setSound(true), ready }); }
})();
</script>
<!--/PAGE-->
</body>
</html>
