<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Somewhere Sheltered</title>
<style>
html, body { margin: 0; height: 100%; background: #07090d; overflow: hidden; }
#scene { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
#scene > * { position: absolute; left: 0; top: 0; display: block; pointer-events: none; }
#scene canvas.px { image-rendering: pixelated; }
#light { mix-blend-mode: screen; }
#hint { position: fixed; left: 16px; bottom: 16px; font: 600 15px system-ui, sans-serif; color: #f3e6cf; background: rgba(20, 16, 12, .82);
  border: 2px solid rgba(243, 230, 207, .25); padding: 8px 14px; cursor: pointer; }
</style>
</head>
<body>
<div id="scene">
  <canvas id="stage"></canvas>
  <canvas id="out" class="px"></canvas>
  <canvas id="light"></canvas>
  <canvas id="room" class="px"></canvas>
  <canvas id="intro" class="px"></canvas>
</div>
<button id="hint" type="button" hidden>Turn sound on</button>
<script>
/* One page for every fox scene: scene.html?s=<folder>. Everything specific to a scene lives in <folder>/scene.json
   (the painting, where the glass is, the weather, lights, fire, steam, the foxes, and the sound).
   The offline renderer (tools/render.js) drives it through window.__render, the same hook the older scenes use.
   Optional: &type=<name> uses that entry of the scene's "variants" (e.g. the room without the foxes), &open=<seconds> starts
   inside a white-out of snow that blows clear, &take=<n> gives a different performance of the sound.
 */
(async () => {
  'use strict';
  const R = window.__render || null;
  const Q = new URLSearchParams(location.search), name = Q.get('s') || 'toymaker';
  const C = await (await fetch(name + '/scene.json')).json();
  document.title = C.title;
  const V = (C.variants || {})[Q.get('type')] || {};      /* a type of video can have its own picture, e.g. the setting without the foxes */
  if (V.image) C.image = V.image;
  if (V.mask) C.mask = V.mask;
  if (V.foxes === false) { C.breathe = []; C.rig = null; }
  for (const k of ['weather', 'stars', 'twinkles', 'glows', 'flames', 'sparks', 'steam']) if (V[k]) C[k] = V[k];      /* a repainted room moves the lamps, the stove and the mugs */
  /* The picture draws its chance from Math.random (seeded by the renderer). The sound has its own stream, chosen by &take=,
     so any number of different takes of the sound fit the one rendered picture. */
  const stream = a => () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const TAKE = +Q.get('take') || 0, OPEN = +Q.get('open') || 0, MUTE = new Set((Q.get('mute') || '').split(',')), on = k => !MUTE.has(k);
  const [SW, SH] = C.size, GW = Math.round(SW / 2), GH = Math.round(SH / 2), TAU = Math.PI * 2, LOOP = 180;
  const PIX = !!(C.grade && C.grade.pixel);       /* a painting snapped to a true pixel grid is animated on that grid too */
  const $ = id => document.getElementById(id);
  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const clock = () => R ? R.t : performance.now() / 1000;
  const srnd = stream(R ? 104729 * (TAKE + 1) : Date.now() & 0x7ffffff), srand = (a, b) => a + srnd() * (b - a);
  const START = 14, loopTime = t => (((t - START) % LOOP) + LOOP) % LOOP;       /* the loop starts 14 s into the scene's own clock */

  /* ---------- layout: the painting fills the screen; effects are drawn on a half-size grid so they keep the pixel look ---------- */
  const scene = $('scene');
  function layer(id, w, h, pixelated) { const c = $(id); c.width = w; c.height = h; c.style.width = SW + 'px'; c.style.height = SH + 'px'; if (pixelated) c.classList.add('px'); return c.getContext('2d'); }
  scene.style.width = SW + 'px'; scene.style.height = SH + 'px';
  function fit() {
    const s = Math.max(innerWidth / SW, innerHeight / SH);
    scene.style.transform = `translate(${(innerWidth - SW * s) / 2}px,${(innerHeight - SH * s) / 2}px) scale(${s})`;
  }
  addEventListener('resize', fit); fit();

  const load = src => new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = name + '/' + src; });
  const [painting, maskImg] = await Promise.all([load(C.image), load(C.mask)]);
  const stW = PIX ? GW : painting.naturalWidth, stH = PIX ? GH : painting.naturalHeight, K = stW / SW;   /* stage pixels per layout pixel */
  const stx = layer('stage', stW, stH, PIX), ox = layer('out', GW, GH), rx = layer('room', GW, GH);
  const LK = PIX ? 0.5 : 1, lx = layer('light', SW * LK, SH * LK, PIX);
  const pose = document.createElement('canvas'); pose.width = stW; pose.height = stH; const px = pose.getContext('2d');
  const mask = document.createElement('canvas'); mask.width = GW; mask.height = GH; mask.getContext('2d').drawImage(maskImg, 0, 0, GW, GH);
  const small = document.createElement('canvas'); small.width = GW; small.height = GH;
  const sx = small.getContext('2d', { willReadFrequently: true }); sx.drawImage(painting, 0, 0, GW, GH);
  const pix = sx.getImageData(0, 0, GW, GH).data;

  /* ---------- the two curves everything follows ----------
     storm: how hard it is snowing and blowing, 0..1. One long swell and one lull per loop, a second surge, shorter gusts on top.
     fireLife: how lively the fire is, 0..1: it flares up and dies back.
     Both are made of whole numbers of cycles per 180 s loop, so they come round seamlessly, and both the picture and the
     sound read the same curve: when the snow thickens the wind rises, when the fire flares it crackles more and glows brighter. */
  const wave = (t, k, ph) => Math.sin(TAU * k * t / LOOP + ph);
  const storm = t => clamp(0.5 - 0.36 * Math.cos(TAU * t / LOOP + 2.8) + 0.18 * wave(t, 2, 4.4) + 0.1 * wave(t, 5, 1.6) + 0.06 * wave(t, 9, 2.5), 0, 1);
  const gust = t => clamp(storm(t) + 0.1 * wave(t, 15, 1.3) + 0.06 * wave(t, 24, 2.2), 0, 1);
  const fireLife = t => clamp(0.5 + 0.3 * wave(t, 3, 0.4) + 0.2 * wave(t, 7, 2.6) + 0.13 * wave(t, 13, 5.1), 0, 1);
  /* The loud pops of the fire sit at fixed moments of the loop, the same every time round and in every take of the sound, so
     the picture can answer each one with a flash of firelight and a burst of sparks. A lively fire has many more of them. */
  const S = C.sound || {};
  const POPS = (() => {
    if (!S.fire) return [];
    const r = stream(4242), out = [], gap = 0.25 * 0.05 + 0.75 * (S.fire.gap || 0.3), rate = F => (0.03 + 0.15 * F) * (0.4 + 1.4 * F) / gap, top = rate(1);
    for (let q = -Math.log(1 - r()) / top; q < LOOP; q -= Math.log(1 - r()) / top) if (r() < rate(fireLife(q + START)) / top) out.push(q);
    return out;
  })();
  function popsIn(t0, t1) {       /* the pops in (t0, t1], as times on the scene's clock */
    const out = [];
    for (let base = Math.floor((t0 - START) / LOOP) * LOOP + START; base < t1; base += LOOP) for (const q of POPS) { const at = base + q; if (at > t0 && at <= t1) out.push(at); }
    return out;
  }

  /* ---------- outside the glass ---------- */
  const W = C.weather || {}, box = (W.box || [0, 0, SW, SH]).map(v => v / 2);
  const flakes = [];
  function newFlake(top) {
    return { x: rand(box[0] - 20, box[2] + 60), y: top ? box[1] - rand(0, 8) : rand(box[1], box[3]), z: Math.pow(Math.random(), 1.4), ph: rand(0, TAU), u: Math.random() };
  }
  if (W.type === 'snow') for (let i = 0; i < W.count; i++) flakes.push(newFlake(false));

  const stars = [];
  if (C.stars) for (let tries = 0; stars.length < C.stars.count && tries < 4000; tries++) {
    const x = Math.floor(rand(C.stars.rect[0], C.stars.rect[2]) / 2), y = Math.floor(rand(C.stars.rect[1], C.stars.rect[3]) / 2), o = (y * GW + x) * 4;
    const r = pix[o], g = pix[o + 1], b = pix[o + 2];
    if (b > r + 6 && r + g + b < 200) stars.push({ x, y, w: TAU * Math.round(rand(20, 60)) / LOOP, ph: rand(0, TAU), a: rand(0.5, 1) });   /* open sky only */
  }

  let clouds = null;
  if (W.clouds) {            /* long, wind-torn cloud that tiles sideways */
    const tw = 512, th = Math.round((W.clouds.rect[3] - W.clouds.rect[1]) / 2), c = document.createElement('canvas'); c.width = tw; c.height = th;
    const cx = c.getContext('2d'), im = cx.createImageData(tw, th), P = 16, lat = Array.from({ length: P * P }, Math.random), s = v => v * v * (3 - 2 * v);
    const n = (u, v, k) => { const x0 = Math.floor(u), y0 = Math.floor(v), fx = s(u - x0), fy = s(v - y0), a = (i, j) => lat[(j % P) * P + ((i % k) + k) % k];
      const top = a(x0, y0) + (a(x0 + 1, y0) - a(x0, y0)) * fx, bot = a(x0, y0 + 1) + (a(x0 + 1, y0 + 1) - a(x0, y0 + 1)) * fx; return top + (bot - top) * fy; };
    for (let j = 0; j < th; j++) for (let i = 0; i < tw; i++) {
      const v = 0.55 * n(i / tw * 4, j / th * 2.2, 4) + 0.3 * n(i / tw * 8, j / th * 4.5 + 3, 8) + 0.15 * n(i / tw * 16, j / th * 9 + 7, 16);
      const edge = Math.min(1, j / (th * 0.25)) * Math.min(1, (th - j) / (th * 0.3)), o = (j * tw + i) * 4;
      im.data[o] = 150; im.data[o + 1] = 164; im.data[o + 2] = 200; im.data[o + 3] = 255 * clamp((v - 0.5) * 3.4, 0, 1) * edge * W.clouds.alpha;
    }
    cx.putImageData(im, 0, 0); clouds = c;
  }
  const dust = [];
  if (W.dust) for (let i = 0; i < W.dust; i++) dust.push({ x: rand(box[0], box[2]), y: rand(box[1], box[3]), v: rand(120, 260), a: rand(0.1, 0.28), len: Math.floor(rand(2, 6)) });

  function weather(t, dt) {
    const g = gust(t), st = storm(t);
    ox.globalCompositeOperation = 'source-over'; ox.clearRect(0, 0, GW, GH);
    for (const s of stars) {
      ox.fillStyle = `rgba(226,234,255,${(s.a * Math.pow(0.5 + 0.5 * Math.sin(s.w * t + s.ph), 3)).toFixed(2)})`; ox.fillRect(s.x, s.y, 1, 1);
    }
    if (clouds) {
      const r = W.clouds.rect, off = (t * W.clouds.speed * (0.7 + 0.6 * g)) % 512;
      ox.save(); ox.beginPath(); ox.rect(r[0] / 2, r[1] / 2, (r[2] - r[0]) / 2, (r[3] - r[1]) / 2); ox.clip();
      for (let x = r[0] / 2 - off; x < r[2] / 2; x += 512) ox.drawImage(clouds, Math.round(x), Math.round(r[1] / 2));
      ox.restore();
    }
    if (W.grass) {            /* pale waves running through the grass as each gust crosses the moor */
      const r = W.grass.rect.map(v => v / 2), span = r[2] - r[0] + 120;
      ox.save(); ox.beginPath(); ox.rect(r[0], r[1], r[2] - r[0], r[3] - r[1]); ox.clip(); ox.transform(1, 0, -0.7, 1, 0.7 * r[1], 0);
      for (let k = 0; k < 4; k++) {
        const x = r[2] + 100 - ((t * W.grass.speed + k * span / 4 + 23 * Math.sin(k * 1.7)) % span), gr = ox.createLinearGradient(x - 16, 0, x + 16, 0);
        gr.addColorStop(0, 'rgba(214,224,240,0)'); gr.addColorStop(0.5, `rgba(214,224,240,${(W.grass.alpha * (0.4 + g)).toFixed(3)})`); gr.addColorStop(1, 'rgba(214,224,240,0)');
        ox.fillStyle = gr; ox.fillRect(x - 16, r[1] - 60, 32, r[3] - r[1] + 120);
      }
      ox.restore();
    }
    for (const d of dust) {
      d.x -= d.v * (0.5 + g) * dt; if (d.x < box[0] - 8) { d.x = box[2] + rand(0, 30); d.y = rand(box[1], box[3]); }
      ox.fillStyle = `rgba(204,214,232,${d.a})`; ox.fillRect(Math.round(d.x), Math.round(d.y), d.len, 1);
    }
    if (W.type === 'snow') {
      /* how much of the snow is in the air right now: every flake has its own threshold and fades in or out as the storm crosses it */
      const calm = W.calm === undefined ? 0.3 : W.calm, dens = calm + (1 - calm) * Math.pow(st, 1.3);
      if (W.haze) { ox.fillStyle = `rgba(206,219,238,${(W.haze * (0.15 + 1.25 * g * g)).toFixed(3)})`; ox.fillRect(box[0], box[1], box[2] - box[0], box[3] - box[1]); }
      const wind = W.wind * (1 - W.gusty + W.gusty * 2 * g);
      for (let i = 0; i < flakes.length; i++) {
        const f = flakes[i], vy = (W.fall[0] + (W.fall[1] - W.fall[0]) * f.z) * (1 + W.gusty * 0.5 * (g - 0.5));
        const vx = wind * (0.45 + 0.75 * f.z) + Math.sin(t * 1.1 + f.ph) * W.sway;
        f.x += vx * dt; f.y += vy * dt;
        if (f.y > box[3] + 2 || f.x < box[0] - 30 || f.x > box[2] + 70) {
          const fromSide = f.y <= box[3] + 2 && f.x < box[0] - 30; flakes[i] = newFlake(!fromSide || Math.random() < 0.5); flakes[i].u = f.u;
          if (fromSide) flakes[i].x = box[2] + rand(0, 60); continue;
        }
        const vis = clamp((dens - f.u) / 0.1, 0, 1); if (!vis) continue;
        const a = (0.3 + 0.65 * f.z) * W.alpha * vis, sz = f.z > 0.84 ? 2 : 1, v = Math.hypot(vx, vy), len = W.streak ? clamp(Math.round(v * W.streak), 1, 7) : 1;
        for (let k = 0; k < len; k++) {
          ox.fillStyle = `rgba(236,242,252,${(a * (1 - k / len)).toFixed(2)})`;
          ox.fillRect(Math.round(f.x - vx / v * k), Math.round(f.y - vy / v * k), sz, sz);
        }
      }
    }
    ox.globalCompositeOperation = 'destination-in'; ox.drawImage(mask, 0, 0);
  }

  /* ---------- light: fairy lights, firelight, lamps (added on top of the painting) ---------- */
  const PERIODS = [3, 4, 4.5, 5, 6, 7.5, 9];
  const twinkles = (C.twinkles || []).map(p => ({ x: p[0], y: p[1], r: p[2] || 10, c: p[3] || '255,214,150', w: TAU / PERIODS[Math.floor(Math.random() * PERIODS.length)], ph: rand(0, TAU) }));
  const flick = (t, s) => clamp(0.5 + 0.2 * Math.sin(t * 2.3 + s) + 0.22 * Math.sin(t * 9.1 + 2 * s) + 0.16 * Math.sin(t * 14.3 + 3 * s) + 0.12 * Math.sin(t * 23.7 + 5 * s), 0, 1);
  let flash = 0, seen = null;       /* a moment of extra firelight when a log pops; the last moment the picture has answered up to */
  function blob(x, y, r, c, a) {
    const g = lx.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, `rgba(${c},${clamp(a, 0, 1).toFixed(3)})`); g.addColorStop(1, `rgba(${c},0)`);
    lx.fillStyle = g; lx.fillRect(x - r, y - r, 2 * r, 2 * r);
  }
  function lights(t) {
    const F = fireLife(t), tw = C.twinkle_strength === undefined ? 0.6 : C.twinkle_strength;
    lx.setTransform(LK, 0, 0, LK, 0, 0); lx.clearRect(0, 0, SW, SH); lx.globalCompositeOperation = 'lighter';
    for (const p of twinkles) blob(p.x, p.y, p.r, p.c, tw * Math.pow(0.5 + 0.5 * Math.sin(p.w * t + p.ph), 2));
    (C.glows || []).forEach((g, i) => blob(g.x, g.y, g.r, g.c, g.kind === 'fire' ? g.base * (0.7 + 0.6 * F) + g.amp * (0.5 + F) * flick(t, i + 1) + 0.14 * flash : g.base + g.amp * (0.5 + 0.5 * Math.sin(t * 0.9 + i))));
    (C.flames || []).forEach((f, i) => {     /* a few bright patches wandering over the painted flames, so the fire is never still */
      for (let k = 0; k < 3; k++) {
        const s = i * 7 + k * 2.1, x = f.x + f.w * (0.5 + 0.32 * Math.sin(t * (5.3 + k) + s)), y = f.y + f.h * (0.55 + 0.3 * Math.sin(t * (7.1 + 1.3 * k) + 2 * s));
        blob(x, y, f.w * 0.55, f.c || '255,176,70', (0.08 + 0.26 * flick(t * 1.4, s)) * (0.55 + 0.9 * F) + 0.2 * flash);
      }
    });
  }

  /* ---------- in the room: steam and sparks ---------- */
  const steam = [], sparks = [];
  const spark = (s, fast) => sparks.push({ x: (s.x + rand(0, s.w)) / 2, y: s.y / 2, vx: rand(-5, 5) * (fast ? 2 : 1), vy: -rand(14, 30) * (fast ? 1.5 : 1), life: rand(0.7, 1.5), age: 0 });
  function room(t, dt) {
    const F = fireLife(t);
    for (const at of popsIn(seen === null ? t : Math.max(seen, t - 0.5), t)) { flash = 1; for (const s of C.sparks || []) for (let k = 0, n = 3 + Math.floor(Math.random() * 4); k < n; k++) spark(s, true); }
    seen = t;
    flash *= Math.exp(-dt / 0.16);
    rx.clearRect(0, 0, GW, GH);
    /* Steam. A source with a width "w" is a hot drink: a full column of steam off the whole surface that rises, widens and
       bends in the room's slow draught as one, with thicker wisps low down. Without "w" it is a thin thread (a kettle spout). */
    for (const s of C.steam || []) {
      if (!s.w) { if (Math.random() < dt * (s.rate || 7)) steam.push({ s, x: s.x / 2 + rand(-1.5, 1.5), y: s.y / 2, x0: s.x / 2, life: rand(2, 3.4), age: 0, ph: rand(0, TAU), h: s.height || 1 }); continue; }
      for (let n = dt * s.rate; n > 0; n--) if (Math.random() < Math.min(1, n))
        steam.push({ s, x: (s.x + rand(-0.5, 0.5) * s.w) / 2, x0: s.x / 2, y: s.y / 2 + rand(-1, 1), life: rand(2.2, 4) * (s.life || 1), age: 0, ph: rand(0, TAU), h: (s.height || 1) * rand(0.8, 1.2), big: Math.random() < (s.thick || 0.3) });
    }
    for (let i = steam.length - 1; i >= 0; i--) {
      const p = steam[i]; p.age += dt; if (p.age > p.life) { steam.splice(i, 1); continue; }
      p.y -= 9 * p.h * dt; const k = p.age / p.life, s = p.s;
      if (!s.w) {
        rx.fillStyle = `rgba(240,232,220,${(0.3 * Math.sin(Math.PI * k)).toFixed(2)})`;
        rx.fillRect(Math.round(p.x + Math.sin(p.age * 2 + p.ph) * (1 + 4 * k)), Math.round(p.y), 1, 1); continue;
      }
      const bend = (s.bend || 6) * k * k * Math.sin(t * 0.45 + s.x) + 2 * k * Math.sin(t * 1.3 + 2 * s.x);           /* the whole column leans together */
      const x = p.x + (p.x - p.x0) * k * 0.8 + bend + Math.sin(p.age * 2.2 + p.ph) * (0.6 + 3 * k);
      /* each puff is soft and grows as it rises; many overlapping puffs make the wisps */
      const r = (p.big ? 1.4 : 0.9) + 2.6 * k, a = (s.alpha || 0.45) * 0.5 * Math.min(1, k * 8) * Math.pow(1 - k, 1.3);
      const c = s.color || '246,238,226', g = rx.createRadialGradient(x, p.y, 0, x, p.y, r); g.addColorStop(0, `rgba(${c},${a.toFixed(3)})`); g.addColorStop(1, `rgba(${c},0)`);      /* steam takes the colour of the light it is in */
      rx.fillStyle = g; rx.fillRect(x - r, p.y - r, 2 * r, 2 * r);
    }
    for (const s of C.sparks || []) if (Math.random() < dt * (s.rate || 1.2) * (0.15 + 2 * F)) spark(s, false);
    for (let i = sparks.length - 1; i >= 0; i--) {
      const p = sparks[i]; p.age += dt; if (p.age > p.life) { sparks.splice(i, 1); continue; }
      p.x += (p.vx + Math.sin(p.age * 9) * 3) * dt; p.y += p.vy * dt;
      rx.fillStyle = `rgba(255,${190 - Math.round(70 * p.age / p.life)},90,${(0.9 * (1 - p.age / p.life)).toFixed(2)})`; rx.fillRect(Math.round(p.x), Math.round(p.y), 1, 1);
    }
  }

  /* ---------- the foxes ----------
     They sleep: their bodies rise and fall, and now and then an ear flicks. Heads and ears are separate pieces cut from the
     painting (tools/rig.py), lying on a copy of the painting with fur filled in behind them; with every piece at rest the
     picture is the painting. Only the ears turn, each about its own base. The heads stay still (they are pieces so that an ear
     slides behind the right things).
     Breathing: each body is a soft-edged patch redrawn a touch taller and back, anchored where the fox lies. */
  const RIG = C.rig ? await (await fetch(name + '/rig/rig.json')).json() : null, parts = {};
  let plate = painting;
  if (RIG) { plate = await load('rig/plate.webp'); for (const p of RIG.parts) parts[p.name] = Object.assign({ img: await load('rig/' + p.file) }, p); }
  const pk = plate.naturalWidth / stW;        /* the plate is stored at stage size */
  const patches = (C.breathe || []).map(b => {
    const c = document.createElement('canvas'); c.width = Math.round(2 * b.rx * K); c.height = Math.round(2 * b.ry * K); return { b, c, x: c.getContext('2d') };
  });
  /* one quick there-and-back of an ear: `amp` degrees at most, over `dur` seconds, starting `at` seconds into the loop */
  const twitch = (u, at, amp, dur) => { const x = (u - at) / (dur || 0.36); return x <= 0 || x >= 1 ? 0 : amp * Math.sin(TAU * x) * (1 - x) * 1.5; };
  /* When each ear flicks, in seconds from the start of the loop: [time, degrees]. The first second of the video has two, so
     there is life on screen straight away; after that they are spread out and uneven, the way a sleeping animal's are. */
  const FLICKS = {
    ear1n: [[0.25, -11], [0.72, -6], [23.2, -10], [58.6, -8], [97.4, -11], [97.95, -6], [141.3, -9], [168.2, -7]],
    ear2r: [[0.55, 10], [12.4, 8], [49.5, 9], [83.1, 7], [118.2, 10], [118.7, 5], [152.8, 9]],
