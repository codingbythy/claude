<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Somewhere Sheltered</title>
<style>
html, body { margin: 0; height: 100%; background: #07090d; overflow: hidden; }
#scene { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
#scene > * { position: absolute; left: 0; top: 0; display: block; pointer-events: none; }
#scene canvas.px { image-rendering: pixelated; }
#light { mix-blend-mode: screen; }
#hint { position: fixed; left: 16px; bottom: 16px; font: 600 15px system-ui, sans-serif; color: #f3e6cf; background: rgba(20, 16, 12, .82);
  border: 2px solid rgba(243, 230, 207, .25); padding: 8px 14px; cursor: pointer; }
</style>
</head>
<body>
<div id="scene">
  <canvas id="stage"></canvas>
  <canvas id="out" class="px"></canvas>
  <canvas id="light"></canvas>
  <canvas id="room" class="px"></canvas>
</div>
<button id="hint" type="button" hidden>Turn sound on</button>
<script>
/* One page for every fox scene: scene.html?s=<folder>. Everything specific to a scene lives in <folder>/scene.json
   (the painting, where the glass is, the weather, lights, fire, steam, the foxes, and the sound).
   The offline renderer (tools/render.js) drives it through window.__render, the same hook the older scenes use.
   Add &open=<seconds> to play the opening, where the foxes nestle into each other, starting at that moment. */
(async () => {
  'use strict';
  const R = window.__render || null;
  const Q = new URLSearchParams(location.search), name = Q.get('s') || 'toymaker';
  const C = await (await fetch(name + '/scene.json')).json();
  document.title = C.title;
  const [SW, SH] = C.size, GW = Math.round(SW / 2), GH = Math.round(SH / 2), TAU = Math.PI * 2, LOOP = 180;
  const PIX = !!(C.grade && C.grade.pixel);       /* a painting snapped to a true pixel grid is animated on that grid too */
  const $ = id => document.getElementById(id);
  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const clock = () => R ? R.t : performance.now() / 1000;

  /* ---------- layout: the painting fills the screen; effects are drawn on a half-size grid so they keep the pixel look ---------- */
  const scene = $('scene');
  function layer(id, w, h, pixelated) { const c = $(id); c.width = w; c.height = h; c.style.width = SW + 'px'; c.style.height = SH + 'px'; if (pixelated) c.classList.add('px'); return c.getContext('2d'); }
  scene.style.width = SW + 'px'; scene.style.height = SH + 'px';
  function fit() {
    const s = Math.max(innerWidth / SW, innerHeight / SH);
    scene.style.transform = `translate(${(innerWidth - SW * s) / 2}px,${(innerHeight - SH * s) / 2}px) scale(${s})`;
  }
  addEventListener('resize', fit); fit();

  const load = src => new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = name + '/' + src; });
  const [painting, maskImg] = await Promise.all([load(C.image), load(C.mask)]);
  const stW = PIX ? GW : painting.naturalWidth, stH = PIX ? GH : painting.naturalHeight, K = stW / SW;   /* stage pixels per layout pixel */
  const stx = layer('stage', stW, stH, PIX), ox = layer('out', GW, GH), rx = layer('room', GW, GH);
  const LK = PIX ? 0.5 : 1, lx = layer('light', SW * LK, SH * LK, PIX);
  const pose = document.createElement('canvas'); pose.width = stW; pose.height = stH; const px = pose.getContext('2d');
  const mask = document.createElement('canvas'); mask.width = GW; mask.height = GH; mask.getContext('2d').drawImage(maskImg, 0, 0, GW, GH);
  const small = document.createElement('canvas'); small.width = GW; small.height = GH;
  const sx = small.getContext('2d', { willReadFrequently: true }); sx.drawImage(painting, 0, 0, GW, GH);
  const pix = sx.getImageData(0, 0, GW, GH).data;

  /* ---------- the two curves everything follows ----------
     storm: how hard it is snowing and blowing, 0..1. One long swell and one lull per loop, a second surge, shorter gusts on top.
     fireLife: how lively the fire is, 0..1: it flares up and dies back.
     Both are made of whole numbers of cycles per 180 s loop, so they come round seamlessly, and both the picture and the
     sound read the same curve: when the snow thickens the wind rises, when the fire flares it crackles more and glows brighter. */
  const wave = (t, k, ph) => Math.sin(TAU * k * t / LOOP + ph);
  const storm = t => clamp(0.5 - 0.36 * Math.cos(TAU * t / LOOP + 2.8) + 0.18 * wave(t, 2, 4.4) + 0.1 * wave(t, 5, 1.6) + 0.06 * wave(t, 9, 2.5), 0, 1);
  const gust = t => clamp(storm(t) + 0.1 * wave(t, 15, 1.3) + 0.06 * wave(t, 24, 2.2), 0, 1);
  const fireLife = t => clamp(0.5 + 0.3 * wave(t, 3, 0.4) + 0.2 * wave(t, 7, 2.6) + 0.13 * wave(t, 13, 5.1), 0, 1);

  /* ---------- outside the glass ---------- */
  const W = C.weather || {}, box = (W.box || [0, 0, SW, SH]).map(v => v / 2);
  const flakes = [];
  function newFlake(top) {
    return { x: rand(box[0] - 20, box[2] + 60), y: top ? box[1] - rand(0, 8) : rand(box[1], box[3]), z: Math.pow(Math.random(), 1.4), ph: rand(0, TAU), u: Math.random() };
  }
  if (W.type === 'snow') for (let i = 0; i < W.count; i++) flakes.push(newFlake(false));

  const stars = [];
  if (C.stars) for (let tries = 0; stars.length < C.stars.count && tries < 4000; tries++) {
    const x = Math.floor(rand(C.stars.rect[0], C.stars.rect[2]) / 2), y = Math.floor(rand(C.stars.rect[1], C.stars.rect[3]) / 2), o = (y * GW + x) * 4;
    const r = pix[o], g = pix[o + 1], b = pix[o + 2];
    if (b > r + 6 && r + g + b < 200) stars.push({ x, y, w: TAU * Math.round(rand(20, 60)) / LOOP, ph: rand(0, TAU), a: rand(0.5, 1) });   /* open sky only */
  }

  let clouds = null;
  if (W.clouds) {            /* long, wind-torn cloud that tiles sideways */
    const tw = 512, th = Math.round((W.clouds.rect[3] - W.clouds.rect[1]) / 2), c = document.createElement('canvas'); c.width = tw; c.height = th;
    const cx = c.getContext('2d'), im = cx.createImageData(tw, th), P = 16, lat = Array.from({ length: P * P }, Math.random), s = v => v * v * (3 - 2 * v);
    const n = (u, v, k) => { const x0 = Math.floor(u), y0 = Math.floor(v), fx = s(u - x0), fy = s(v - y0), a = (i, j) => lat[(j % P) * P + ((i % k) + k) % k];
      const top = a(x0, y0) + (a(x0 + 1, y0) - a(x0, y0)) * fx, bot = a(x0, y0 + 1) + (a(x0 + 1, y0 + 1) - a(x0, y0 + 1)) * fx; return top + (bot - top) * fy; };
    for (let j = 0; j < th; j++) for (let i = 0; i < tw; i++) {
      const v = 0.55 * n(i / tw * 4, j / th * 2.2, 4) + 0.3 * n(i / tw * 8, j / th * 4.5 + 3, 8) + 0.15 * n(i / tw * 16, j / th * 9 + 7, 16);
      const edge = Math.min(1, j / (th * 0.25)) * Math.min(1, (th - j) / (th * 0.3)), o = (j * tw + i) * 4;
      im.data[o] = 150; im.data[o + 1] = 164; im.data[o + 2] = 200; im.data[o + 3] = 255 * clamp((v - 0.5) * 3.4, 0, 1) * edge * W.clouds.alpha;
    }
    cx.putImageData(im, 0, 0); clouds = c;
  }
  const dust = [];
  if (W.dust) for (let i = 0; i < W.dust; i++) dust.push({ x: rand(box[0], box[2]), y: rand(box[1], box[3]), v: rand(120, 260), a: rand(0.1, 0.28), len: Math.floor(rand(2, 6)) });

  function weather(t, dt) {
    const g = gust(t), st = storm(t);
    ox.globalCompositeOperation = 'source-over'; ox.clearRect(0, 0, GW, GH);
    for (const s of stars) {
      ox.fillStyle = `rgba(226,234,255,${(s.a * Math.pow(0.5 + 0.5 * Math.sin(s.w * t + s.ph), 3)).toFixed(2)})`; ox.fillRect(s.x, s.y, 1, 1);
    }
    if (clouds) {
      const r = W.clouds.rect, off = (t * W.clouds.speed * (0.7 + 0.6 * g)) % 512;
      ox.save(); ox.beginPath(); ox.rect(r[0] / 2, r[1] / 2, (r[2] - r[0]) / 2, (r[3] - r[1]) / 2); ox.clip();
      for (let x = r[0] / 2 - off; x < r[2] / 2; x += 512) ox.drawImage(clouds, Math.round(x), Math.round(r[1] / 2));
      ox.restore();
    }
    if (W.grass) {            /* pale waves running through the grass as each gust crosses the moor */
      const r = W.grass.rect.map(v => v / 2), span = r[2] - r[0] + 120;
      ox.save(); ox.beginPath(); ox.rect(r[0], r[1], r[2] - r[0], r[3] - r[1]); ox.clip(); ox.transform(1, 0, -0.7, 1, 0.7 * r[1], 0);
      for (let k = 0; k < 4; k++) {
        const x = r[2] + 100 - ((t * W.grass.speed + k * span / 4 + 23 * Math.sin(k * 1.7)) % span), gr = ox.createLinearGradient(x - 16, 0, x + 16, 0);
        gr.addColorStop(0, 'rgba(214,224,240,0)'); gr.addColorStop(0.5, `rgba(214,224,240,${(W.grass.alpha * (0.4 + g)).toFixed(3)})`); gr.addColorStop(1, 'rgba(214,224,240,0)');
        ox.fillStyle = gr; ox.fillRect(x - 16, r[1] - 60, 32, r[3] - r[1] + 120);
      }
      ox.restore();
    }
    for (const d of dust) {
      d.x -= d.v * (0.5 + g) * dt; if (d.x < box[0] - 8) { d.x = box[2] + rand(0, 30); d.y = rand(box[1], box[3]); }
      ox.fillStyle = `rgba(204,214,232,${d.a})`; ox.fillRect(Math.round(d.x), Math.round(d.y), d.len, 1);
    }
    if (W.type === 'snow') {
      /* how much of the snow is in the air right now: every flake has its own threshold and fades in or out as the storm crosses it */
      const calm = W.calm === undefined ? 0.3 : W.calm, dens = calm + (1 - calm) * Math.pow(st, 1.3);
      if (W.haze) { ox.fillStyle = `rgba(206,219,238,${(W.haze * (0.15 + 1.25 * g * g)).toFixed(3)})`; ox.fillRect(box[0], box[1], box[2] - box[0], box[3] - box[1]); }
      const wind = W.wind * (1 - W.gusty + W.gusty * 2 * g);
      for (let i = 0; i < flakes.length; i++) {
        const f = flakes[i], vy = (W.fall[0] + (W.fall[1] - W.fall[0]) * f.z) * (1 + W.gusty * 0.5 * (g - 0.5));
        const vx = wind * (0.45 + 0.75 * f.z) + Math.sin(t * 1.1 + f.ph) * W.sway;
        f.x += vx * dt; f.y += vy * dt;
        if (f.y > box[3] + 2 || f.x < box[0] - 30 || f.x > box[2] + 70) {
          const fromSide = f.y <= box[3] + 2 && f.x < box[0] - 30; flakes[i] = newFlake(!fromSide || Math.random() < 0.5); flakes[i].u = f.u;
          if (fromSide) flakes[i].x = box[2] + rand(0, 60); continue;
        }
        const vis = clamp((dens - f.u) / 0.1, 0, 1); if (!vis) continue;
        const a = (0.3 + 0.65 * f.z) * W.alpha * vis, sz = f.z > 0.84 ? 2 : 1, v = Math.hypot(vx, vy), len = W.streak ? clamp(Math.round(v * W.streak), 1, 7) : 1;
        for (let k = 0; k < len; k++) {
          ox.fillStyle = `rgba(236,242,252,${(a * (1 - k / len)).toFixed(2)})`;
          ox.fillRect(Math.round(f.x - vx / v * k), Math.round(f.y - vy / v * k), sz, sz);
        }
      }
    }
    ox.globalCompositeOperation = 'destination-in'; ox.drawImage(mask, 0, 0);
  }

  /* ---------- light: fairy lights, firelight, lamps (added on top of the painting) ---------- */
  const PERIODS = [3, 4, 4.5, 5, 6, 7.5, 9];
  const twinkles = (C.twinkles || []).map(p => ({ x: p[0], y: p[1], r: p[2] || 10, c: p[3] || '255,214,150', w: TAU / PERIODS[Math.floor(Math.random() * PERIODS.length)], ph: rand(0, TAU) }));
  const flick = (t, s) => clamp(0.5 + 0.2 * Math.sin(t * 2.3 + s) + 0.22 * Math.sin(t * 9.1 + 2 * s) + 0.16 * Math.sin(t * 14.3 + 3 * s) + 0.12 * Math.sin(t * 23.7 + 5 * s), 0, 1);
  let flash = 0;                    /* a moment of extra firelight when a log pops */
  const events = [];                /* big pops the sound has scheduled, so the picture can answer them */
  function blob(x, y, r, c, a) {
    const g = lx.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, `rgba(${c},${clamp(a, 0, 1).toFixed(3)})`); g.addColorStop(1, `rgba(${c},0)`);
    lx.fillStyle = g; lx.fillRect(x - r, y - r, 2 * r, 2 * r);
  }
  function lights(t) {
    const F = fireLife(t), tw = C.twinkle_strength === undefined ? 0.6 : C.twinkle_strength;
    lx.setTransform(LK, 0, 0, LK, 0, 0); lx.clearRect(0, 0, SW, SH); lx.globalCompositeOperation = 'lighter';
    for (const p of twinkles) blob(p.x, p.y, p.r, p.c, tw * Math.pow(0.5 + 0.5 * Math.sin(p.w * t + p.ph), 2));
    (C.glows || []).forEach((g, i) => blob(g.x, g.y, g.r, g.c, g.kind === 'fire' ? g.base * (0.7 + 0.6 * F) + g.amp * (0.5 + F) * flick(t, i + 1) + 0.14 * flash : g.base + g.amp * (0.5 + 0.5 * Math.sin(t * 0.9 + i))));
    (C.flames || []).forEach((f, i) => {     /* a few bright patches wandering over the painted flames, so the fire is never still */
      for (let k = 0; k < 3; k++) {
        const s = i * 7 + k * 2.1, x = f.x + f.w * (0.5 + 0.32 * Math.sin(t * (5.3 + k) + s)), y = f.y + f.h * (0.55 + 0.3 * Math.sin(t * (7.1 + 1.3 * k) + 2 * s));
        blob(x, y, f.w * 0.55, f.c || '255,176,70', (0.08 + 0.26 * flick(t * 1.4, s)) * (0.55 + 0.9 * F) + 0.2 * flash);
      }
    });
  }

  /* ---------- in the room: steam and sparks ---------- */
  const steam = [], sparks = [];
  const spark = (s, fast) => sparks.push({ x: (s.x + rand(0, s.w)) / 2, y: s.y / 2, vx: rand(-5, 5) * (fast ? 2 : 1), vy: -rand(14, 30) * (fast ? 1.5 : 1), life: rand(0.7, 1.5), age: 0 });
  function room(t, dt) {
    const F = fireLife(t);
    while (events.length && events[0] <= t) { events.shift(); flash = 1; for (const s of C.sparks || []) for (let k = 0, n = 3 + Math.floor(Math.random() * 4); k < n; k++) spark(s, true); }
    flash *= Math.exp(-dt / 0.16);
    rx.clearRect(0, 0, GW, GH);
    for (const s of C.steam || []) if (Math.random() < dt * (s.rate || 7)) steam.push({ x: s.x / 2 + rand(-1.5, 1.5), y: s.y / 2, life: rand(2, 3.4), age: 0, ph: rand(0, TAU), h: s.height || 1 });
    for (let i = steam.length - 1; i >= 0; i--) {
      const p = steam[i]; p.age += dt; if (p.age > p.life) { steam.splice(i, 1); continue; }
      p.y -= 9 * p.h * dt; const k = p.age / p.life;
      rx.fillStyle = `rgba(240,232,220,${(0.3 * Math.sin(Math.PI * k)).toFixed(2)})`;
      rx.fillRect(Math.round(p.x + Math.sin(p.age * 2 + p.ph) * (1 + 4 * k)), Math.round(p.y), 1, 1);
    }
    for (const s of C.sparks || []) if (Math.random() < dt * (s.rate || 1.2) * (0.15 + 2 * F)) spark(s, false);
    for (let i = sparks.length - 1; i >= 0; i--) {
      const p = sparks[i]; p.age += dt; if (p.age > p.life) { sparks.splice(i, 1); continue; }
      p.x += (p.vx + Math.sin(p.age * 9) * 3) * dt; p.y += p.vy * dt;
      rx.fillStyle = `rgba(255,${190 - Math.round(70 * p.age / p.life)},90,${(0.9 * (1 - p.age / p.life)).toFixed(2)})`; rx.fillRect(Math.round(p.x), Math.round(p.y), 1, 1);
    }
  }

  /* ---------- the foxes ----------
     Their heads and ears are separate pieces cut from the painting (tools/rig.py), lying on a copy of the painting with fur
     filled in behind them. With every piece at rest the picture is the painting; turning a piece about its neck or ear base
     is what makes a fox lift its head, push in, or flick an ear. Bodies and tails are nudged by a gentle bend of the picture.
     Breathing: each body is a soft-edged patch redrawn a touch taller and back, anchored where the fox lies. */
  const RIG = C.rig ? await (await fetch(name + '/rig/rig.json')).json() : null, parts = {};
  let plate = painting;
  if (RIG) { plate = await load('rig/plate.webp'); for (const p of RIG.parts) parts[p.name] = Object.assign({ img: await load('rig/' + p.file) }, p); }
  const pk = plate.naturalWidth / stW;        /* the plate is stored at stage size */
  const patches = (C.breathe || []).map(b => {
    const c = document.createElement('canvas'); c.width = Math.round(2 * b.rx * K); c.height = Math.round(2 * b.ry * K); return { b, c, x: c.getContext('2d') };
  });
  const openAt = Q.has('open') ? +Q.get('open') : (R ? null : clock() + 0.4), CELL = 8, BEND = (C.cuddle && C.cuddle.parts) || [];
  let bendBox = null;
  if (BEND.length) {
    let x0 = SW, y0 = SH, x1 = 0, y1 = 0;
    for (const p of BEND) { x0 = Math.min(x0, p.cx - 2.2 * p.r); y0 = Math.min(y0, p.cy - 2.2 * p.r); x1 = Math.max(x1, p.cx + 2.2 * p.r); y1 = Math.max(y1, p.cy + 2.2 * p.r); }
    bendBox = [Math.max(0, Math.floor(x0 / CELL) * CELL), Math.max(0, Math.floor(y0 / CELL) * CELL), Math.min(SW, x1), Math.min(SH, y1)];
  }
  /* small timing helpers: key() eases through a list of [seconds, value]; twitch() is one quick there-and-back; swell() rises and falls once */
  const key = (k, u) => { if (u <= k[0][0]) return k[0][1]; for (let i = 1; i < k.length; i++) if (u < k[i][0]) { const x = (u - k[i - 1][0]) / (k[i][0] - k[i - 1][0]); return k[i - 1][1] + (k[i][1] - k[i - 1][1]) * x * x * (3 - 2 * x); } return k[k.length - 1][1]; };
  const twitch = (u, at, amp, dur) => { const x = (u - at) / (dur || 0.36); return x <= 0 || x >= 1 ? 0 : amp * Math.sin(TAU * x) * (1 - x) * 1.5; };
  const swell = (u, a, b) => { const x = (u - a) / (b - a); return x <= 0 || x >= 1 ? 0 : Math.pow(Math.sin(Math.PI * x), 2); };
  /* Where every piece is at time t. h1 is the left fox's head, h2 the right fox's: r is a turn in degrees about the neck, x and y a
     shift. e.. are the ears, b1 b2 the bodies, t2 the right fox's tail, sigh a deeper breath. Everything is 0 at rest. */
  function poseAt(t) {
    const P = { h1r: 0, h1x: 0, h1y: 0, h2r: 0, h2x: 0, h2y: 0, e1n: 0, e1f: 0, e2l: 0, e2r: 0, b1: 0, b2: 0, t2: 0, sigh: 0 };
    /* asleep: now and then an ear flicks, once a loop they nuzzle closer and sigh, a tail twitches. Timed within the loop so it comes round. */
    const q = (((t - 14) % LOOP) + LOOP) % LOOP;
    P.e1n = twitch(q, 23.2, -10) + twitch(q, 97.4, -11) + twitch(q, 97.95, -6) + twitch(q, 141.3, -9);
    P.e2r = twitch(q, 49.5, 9) + twitch(q, 118.2, 10) + twitch(q, 118.7, 5);
    P.e2l = twitch(q, 71.3, 10) + twitch(q, 160.4, 9);
    P.e1f = twitch(q, 133.6, -7);
    const n2 = swell(q, 84, 88.5), n1 = swell(q, 84.5, 89.5);
    P.h2r = -1.8 * n2; P.h2x = -3 * n2; P.h1r = 1.0 * n1; P.b2 = -0.35 * n2;
    P.t2 = twitch(q, 36, 0.7, 0.9) + twitch(q, 110, 0.6, 0.9);
    P.sigh = swell(q, 87.5, 93);
    /* the opening: the right fox has its head up; it comes down and pushes in under the other's chin, the left fox is nudged up,
       settles back down on top, ears flick, the tail curls in, and both let out a long breath */
    if (openAt !== null && t - openAt < 4.5) {
      const u = t - openAt;
      P.h2r += key([[0, 11], [0.16, 10.6], [0.72, -2.2], [1.12, 0.9], [1.6, -0.25], [2.1, 0]], u);
      P.h2x += key([[0, 12], [0.72, -5], [1.15, 1.2], [1.7, 0]], u);
      P.h2y += key([[0, -3], [0.72, 2], [1.2, 0]], u);
      P.h1r += key([[0, -2.5], [0.45, -2.8], [0.82, -6], [1.32, 1.3], [1.8, -0.3], [2.3, 0]], u);
      P.h1x += key([[0, -3], [0.82, -7], [1.38, 1], [2, 0]], u);
      P.h1y += key([[0, 0], [0.82, -2], [1.35, 1], [2, 0]], u);
      P.e2l += twitch(u, 0.98, 13); P.e2r += twitch(u, 1.06, 7); P.e1n += twitch(u, 1.55, -11); P.e1f += twitch(u, 1.62, -5);
      P.b2 += key([[0, 1], [0.72, -0.3], [1.2, 0.08], [1.8, 0]], u); P.b1 += key([[0, 0.4], [0.82, 1], [1.4, -0.1], [2, 0]], u);
      P.t2 += key([[0, 1], [1.0, 1], [2.2, -0.2], [3.0, 0]], u);
      P.sigh += key([[0, 0], [0.9, 0], [2.0, 1], [3.8, 0]], u);
    }
    return P;
  }
  const MOVES = { head1: ['h1r', 'h1x', 'h1y'], head2: ['h2r', 'h2x', 'h2y'], ear1n: ['e1n'], ear1f: ['e1f'], ear2l: ['e2l'], ear2r: ['e2r'] };
  function place(p, P) {          /* turn and shift the drawing surface the way this piece has moved */
    const m = MOVES[p.name] || [], r = P[m[0]] || 0, x = P[m[1]] || 0, y = P[m[2]] || 0;
    if (!r && !x && !y) return;
    stx.translate((p.pivot[0] + x) * K, (p.pivot[1] + y) * K); stx.rotate(r * Math.PI / 180); stx.translate(-p.pivot[0] * K, -p.pivot[1] * K);
  }
  function foxes(t) {
    const P = poseAt(t);
    px.globalCompositeOperation = 'source-over'; px.drawImage(plate, 0, 0, stW, stH);
    for (const { b, c, x } of patches) {
      const s = 1 + b.amt * (0.5 - 0.5 * Math.cos(TAU * t / b.period + (b.phase || 0))) + 0.016 * P.sigh, w = c.width, h = c.height;
      x.globalCompositeOperation = 'source-over'; x.clearRect(0, 0, w, h);
      x.drawImage(plate, (b.cx - b.rx) * K * pk, (b.cy - b.ry) * K * pk, w * pk, h * pk, 0, -(s - 1) * h, w, s * h);
      x.globalCompositeOperation = 'destination-in'; x.save(); x.translate(w / 2, h / 2); x.scale(1, h / w);
      const g = x.createRadialGradient(0, 0, 0, 0, 0, w / 2); g.addColorStop(0, '#000'); g.addColorStop(0.55, '#000'); g.addColorStop(1, 'rgba(0,0,0,0)');
      x.fillStyle = g; x.fillRect(-w / 2, -w / 2, w, w); x.restore();
      px.drawImage(c, Math.round((b.cx - b.rx) * K), Math.round((b.cy - b.ry) * K));
    }
    stx.setTransform(1, 0, 0, 1, 0, 0); stx.drawImage(pose, 0, 0);
    if (bendBox && (Math.abs(P.b1) + Math.abs(P.b2) + Math.abs(P.t2) > 0.004)) {
      for (let y = bendBox[1]; y < bendBox[3]; y += CELL) for (let x = bendBox[0]; x < bendBox[2]; x += CELL) {
        let dx = 0, dy = 0; const mx = x + CELL / 2, my = y + CELL / 2;
        for (const p of BEND) {
          const k = P[p.ch] || 0; if (!k) continue;
          const ex = mx - p.cx, ey = my - p.cy, w = k * Math.exp(-(ex * ex + ey * ey) / (2 * p.r * p.r)), a = (p.rot || 0) * Math.PI / 180;
          dx += w * (p.dx - a * ey); dy += w * (p.dy + a * ex);
        }
        if (Math.abs(dx) + Math.abs(dy) < 0.02) continue;
        stx.drawImage(pose, (x - dx) * K, (y - dy) * K, CELL * K, CELL * K, x * K, y * K, CELL * K, CELL * K);
      }
    }
    if (RIG) for (const n of RIG.order) {
      const p = parts[n]; stx.save();
      if (p.parent) place(parts[p.parent], P);
      place(p, P); stx.drawImage(p.img, p.x, p.y); stx.restore();
    }
  }

  let last = clock();
  function frame() {
    const t = clock(), dt = Math.min(0.05, Math.max(0, t - last)); last = t;
    weather(t, dt); room(t, dt); lights(t); foxes(t);
    if (!R) requestAnimationFrame(frame);
  }

  /* ---------- sound: built from noise and short clicks, in stereo, with the detail kept where small speakers can play it ---------- */
  let ac = null, A = null, running = false;
  const S = C.sound || {}, atime = () => R ? R.t : ac.currentTime;
  function noise(seconds, kind) {       /* 'brown' is deep and rumbling, 'pink' is the even hiss of moving air, 'white' is bright */
    const n = Math.floor(ac.sampleRate * seconds), buf = ac.createBuffer(1, n, ac.sampleRate), d = buf.getChannelData(0);
    let v = 0, b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
    for (let i = 0; i < n; i++) {
      const w = Math.random() * 2 - 1;
      if (kind === 'brown') { v = (v + 0.02 * w) / 1.02; d[i] = v * 3.5; }
      else if (kind === 'pink') {
        b0 = 0.99886 * b0 + w * 0.0555179; b1 = 0.99332 * b1 + w * 0.0750759; b2 = 0.969 * b2 + w * 0.153852; b3 = 0.8665 * b3 + w * 0.3104856;
        b4 = 0.55 * b4 + w * 0.5329522; b5 = -0.7616 * b5 - w * 0.016898; d[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + w * 0.5362) * 0.11; b6 = w * 0.115926;
      } else d[i] = w;
    }
    if (kind !== 'white') {            /* make the ends meet so the buffer loops without a bump */
      const drift = d[n - 1] - d[0]; for (let i = 0; i < n; i++) d[i] -= drift * i / n;
      const xf = Math.floor(ac.sampleRate * 0.25); for (let i = 0; i < xf; i++) { const k = i / xf; d[n - xf + i] = d[n - xf + i] * (1 - k) + d[i] * k; }
    }
    return buf;
  }
  const filt = (type, f, q) => { const b = ac.createBiquadFilter(); b.type = type; b.frequency.value = f; b.Q.value = q || 0.7; return b; };
  const gain = v => { const g = ac.createGain(); g.gain.value = v; return g; };
  const pan = p => { const n = ac.createStereoPanner(); n.pan.value = p; return n; };
  function chain() { for (let i = 1; i < arguments.length; i++) arguments[i - 1].connect(arguments[i]); return arguments[arguments.length - 1]; }
  function loop(buf, rate, at) { const s = ac.createBufferSource(); s.buffer = buf; s.loop = true; s.playbackRate.value = rate || 1; s.start(0, at || 0); return s; }
  function click(at, f, q, peak, len, where, buf) {     /* a short filtered burst: a crackle, a tap on the glass, a clock tick */
    const src = ac.createBufferSource(); src.buffer = buf || A.white; const g = gain(0), p = pan(where);
    g.gain.setValueAtTime(0, at); g.gain.linearRampToValueAtTime(peak, at + 0.002); g.gain.exponentialRampToValueAtTime(0.0004, at + len);
    chain(src, filt('bandpass', f, q), g, p, A.master); src.start(at, Math.random() * 2.5, len + 0.03);
  }
  /* how loud the wind is for a given storm strength: never silent in the lulls, full in the surges */
  const windLevel = g => { const lull = S.wind.lull === undefined ? 0.5 : S.wind.lull; return S.wind.level * (lull + (1 - lull) * Math.pow(g, 1.2)); };

  function buildAudio() {
    ac = R ? R.ac : new (window.AudioContext || window.webkitAudioContext)();
    const master = gain(0), comp = ac.createDynamicsCompressor();
    comp.threshold.value = -20; comp.ratio.value = 2.5; comp.attack.value = 0.03; comp.release.value = 0.5;
    chain(master, filt('highpass', 40, 0.7), comp, ac.destination);     /* nothing below 40 Hz: it is inaudible and only eats headroom */
    A = { brown: noise(13, 'brown'), pink: noise(11, 'pink'), white: noise(4, 'white'), master, sides: [], next: {} };
    const now = atime(), g0 = gust(clock());
    if (S.wind) for (const side of [-1, 1]) {       /* left and right read different stretches of the noise, so the wind has width */
      const w = S.wind, p = pan(side * 0.75), o = side < 0 ? 0 : 5.3, bus = gain(windLevel(g0)); chain(bus, p, master);
      chain(loop(A.brown, 0.9, o), filt('highpass', 80), filt('lowpass', w.bedF || 380), gain(w.bed), bus);            /* the low weight of it */
      const bodyG = gain(w.body * (0.5 + 0.75 * g0)), howlF = filt('bandpass', 700, w.q || 2.5), howlG = gain(w.howl * (0.12 + 0.9 * g0 * g0)), airG = gain(w.air * (0.3 + g0));
      chain(loop(A.pink, 1, o + 1.7), filt('bandpass', w.bodyF || 480, 0.5), bodyG, bus);                               /* the rush */
      chain(loop(A.pink, 1.2, o + 3.1), howlF, howlG, bus);                                                            /* the howl, which climbs in the gusts */
      chain(loop(A.white, 1, o * 0.3), filt('bandpass', w.airF || 2800, 0.6), airG, bus);                              /* air and snow hissing on the glass */
      A.sides.push({ bus, bodyG, howlF, howlG, airG, lag: side < 0 ? 0 : 0.9 });
    }
    if (S.fire) {
      const f = S.fire; A.roarG = gain(f.roar);
      chain(loop(A.brown, 1.6, 2), filt('bandpass', f.kind === 'stove' ? 230 : 320, 0.5), A.roarG, pan(f.pan), master);
      A.next.pop = now + 0.2; A.next.tink = now + rand(3, 8);
    }
    if (S.simmer) chain(loop(A.white, 1, 1), filt('bandpass', 5200, 0.8), gain(S.simmer.level), pan(S.simmer.pan), master);
    if (S.clock) A.next.clock = Math.ceil(now);
    if (S.taps) A.next.tap = now + 0.3;
  }
  const expo = mean => -Math.log(1 - Math.random()) * mean;
  function tick() {       /* about twice a second: steer the wind and fire along their curves and schedule the next couple of seconds of small sounds */
    if (!running) return;
    const now = atime(), ahead = now + 2.5, t = clock();
    A.sides.forEach(s => {
      const w = S.wind, g = gust(t + 0.6 - s.lag);
      s.bus.gain.setTargetAtTime(windLevel(g), now, 0.8);
      s.bodyG.gain.setTargetAtTime(w.body * (0.5 + 0.75 * g), now, 0.8);
      s.howlF.frequency.setTargetAtTime(w.howlF[0] + (w.howlF[1] - w.howlF[0]) * g, now, 0.9);
      s.howlG.gain.setTargetAtTime(w.howl * (0.12 + 0.9 * g * g), now, 0.7);
      s.airG.gain.setTargetAtTime(w.air * (0.3 + g), now, 0.7);
    });
    if (S.fire) {
      const f = S.fire, stove = f.kind === 'stove';
      A.roarG.gain.setTargetAtTime(f.roar * (0.7 + 0.5 * fireLife(t + 0.4)) * (0.85 + 0.3 * Math.random()), now, 0.4);
      if (A.next.pop < now) A.next.pop = now + 0.05;
      while (A.next.pop < ahead) {      /* a lively fire crackles faster and louder and throws more big pops; a low fire ticks over */
        const at = A.next.pop, F = fireLife(t + (at - now)), big = Math.random() < 0.03 + 0.15 * F, where = clamp(f.pan + rand(-0.18, 0.18), -1, 1), lv = f.crackle * (0.5 + 0.95 * F);
        if (stove) click(at, big ? rand(500, 1100) : rand(900, 2600), rand(1, 2.5), lv * (big ? rand(0.3, 0.6) : Math.pow(Math.random(), 2.2) * 0.3 + 0.02), big ? rand(0.03, 0.07) : rand(0.008, 0.03), where);
        else click(at, big ? rand(500, 1400) : rand(1400, 5200), rand(0.8, 2.5), lv * (big ? rand(0.3, 0.6) : Math.pow(Math.random(), 2.2) * 0.34 + 0.02), big ? rand(0.03, 0.07) : rand(0.006, 0.03), where);
        if (big) { events.push(t + (at - now)); events.sort((a, b) => a - b); }      /* the picture answers: a flash of firelight and a burst of sparks */
        A.next.pop += expo((Math.random() < 0.25 ? 0.05 : f.gap || 0.3) / (0.4 + 1.4 * F));
      }
      while (f.tink && A.next.tink < ahead) {      /* the iron ticking as it warms and cools */
        const o = ac.createOscillator(), g = gain(0), at = A.next.tink; o.frequency.value = rand(2300, 3700);
        g.gain.setValueAtTime(0, at); g.gain.linearRampToValueAtTime(f.tink * rand(0.5, 1), at + 0.001); g.gain.exponentialRampToValueAtTime(0.0003, at + 0.05);
        chain(o, g, pan(f.pan), A.master); o.start(at); o.stop(at + 0.08); A.next.tink += rand(4, 13);
      }
    }
    while (S.clock && A.next.clock < ahead) {      /* on the second exactly, so it lines up when the loop comes round */
      const at = A.next.clock, tock = Math.round(at) % 2; click(at, tock ? 1500 : 2100, 6, S.clock.level, 0.014, S.clock.pan); A.next.clock += 1;
    }
    while (S.taps && A.next.tap < ahead) {         /* grains of snow ticking on the glass, more of them when the storm is up */
      click(A.next.tap, rand(2500, 6500), rand(2, 5), S.taps.level * (Math.pow(Math.random(), 2.5) + 0.06), rand(0.004, 0.012), rand(-0.95, -0.15));
      A.next.tap += expo(1 / (S.taps.rate * (0.15 + 1.6 * gust(t + (A.next.tap - now)))));
    }
  }
  function setSound(on) {
    if (on && !ac) buildAudio();
    if (!ac) return;
    if (!R && on) ac.resume();
    running = on; A.master.gain.cancelScheduledValues(atime()); A.master.gain.setTargetAtTime(on ? 0.9 : 0, atime(), 0.15);
    $('hint').textContent = on ? 'Turn sound off' : 'Turn sound on';
  }

  if (R) Object.assign(R, { frame, tick, strike() {}, start: () => setSound(true), ready: () => true });
  else { $('hint').hidden = false; $('hint').addEventListener('click', () => setSound(!running)); setInterval(tick, 450); requestAnimationFrame(frame); }
})();
</script>
</body>
